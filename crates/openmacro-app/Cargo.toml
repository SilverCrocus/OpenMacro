[package]
name = "openmacro-app"
version = "0.3.0"
description = "OpenMacro cross-platform app (Dioxus)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "open-macro"
path = "src/main.rs"

[dependencies]
openmacro-core = { path = "../openmacro-core" }
dioxus = { version = "0.7.10", features = ["router"] }
chrono = { workspace = true, features = ["clock", "wasmbind"] }
serde_json.workspace = true
rxing = { version = "0.9", default-features = false, features = ["oned", "decoders", "encoding_rs"] }
base64 = "0.22"

[dev-dependencies]
rxing = { version = "0.9", default-features = false, features = ["oned", "decoders", "encoders", "encoding_rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmacro-store = { path = "../openmacro-store" }
openmacro-foods = { path = "../openmacro-foods" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tokio = { version = "1", features = ["time"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Bundle assets/foods.db (built with `build-food-db`) into the app.
bundled-foods = []
