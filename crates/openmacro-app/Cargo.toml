[package]
name = "openmacro-app"
version = "0.1.0"
description = "OpenMacro cross-platform app (Dioxus)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "open-macro"
path = "src/main.rs"

[dependencies]
openmacro-core = { path = "../openmacro-core" }
dioxus = { version = "0.7.10", features = ["router"] }
chrono = { workspace = true, features = ["clock", "wasmbind"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmacro-store = { path = "../openmacro-store" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
