name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or goal, not just the solution. "I want to log my usual breakfast in one tap" is more useful than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this
