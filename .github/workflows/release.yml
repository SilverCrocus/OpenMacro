name: Release

# Push a tag like v0.2.0 (annotated; its message becomes the release notes).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/openmacro-app/Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match openmacro-app version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Dioxus CLI
        run: |
          base=https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION
          curl -sSLO "$base/dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "$base/dx-x86_64-unknown-linux-gnu.sha256"
          grep "dx-x86_64-unknown-linux-gnu.tar.gz" dx-x86_64-unknown-linux-gnu.sha256 | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download food datasets
        run: |
          mkdir -p data/raw/usda data/raw/afcd-r3 data/raw/off
          for f in FoodData_Central_survey_food_csv_2024-10-31 \
                   FoodData_Central_foundation_food_csv_2026-04-30 \
                   FoodData_Central_sr_legacy_food_csv_2018-04; do
            curl -sSL -A "Mozilla/5.0" -o "data/raw/usda/$f.zip" "https://fdc.nal.usda.gov/fdc-datasets/$f.zip"
            unzip -q -o "data/raw/usda/$f.zip" -d "data/raw/usda/$f"
          done
          curl -sSL -A "Mozilla/5.0" -o "data/raw/afcd-r3/AFCD Release 3 - Nutrient profiles.xlsx" \
            "https://www.foodstandards.gov.au/sites/default/files/2025-12/AFCD%20Release%203%20-%20Nutrient%20profiles.xlsx"
          curl -sSL -o data/raw/off/en.openfoodfacts.org.products.csv.gz \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz

      - name: Build the food database
        run: |
          cargo run --release -p openmacro-foods --features import --bin build-food-db -- data/raw data/foods.db
          cp data/foods.db crates/openmacro-app/assets/foods.db

      - name: Build APKs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p dist
          for pair in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${pair%%:*}"; abi="${pair##*:}"
            # dx reuses one Gradle project, so clear the previous ABI's library.
            rm -rf target/dx/open-macro/release/android/app/app/src/main/jniLibs
            dx build --release --package openmacro-app --platform android --target "$target" --features bundled-foods
            cp target/dx/open-macro/release/android/app/app/build/outputs/apk/debug/app-debug.apk "dist/unsigned-$abi.apk"
          done

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for abi in arm64-v8a x86_64; do
            out="dist/openmacro-$VERSION-$abi.apk"
            "$apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$out" "dist/unsigned-$abi.apk"
            "$apksigner" verify "$out"
            rm "dist/unsigned-$abi.apk"
          done
          rm "$RUNNER_TEMP/release.jks"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # actions/checkout turns tags into lightweight ones; fetch the annotated tag for its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "---"
            echo "Install \`openmacro-$VERSION-arm64-v8a.apk\` on phones. Installed copies update themselves from here."
            echo
            echo "Food data: USDA FoodData Central (CC0), Australian Food Composition Database (FSANZ, CC BY 4.0), Open Food Facts contributors (ODbL)."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "OpenMacro $VERSION" --notes-file notes.md dist/*
